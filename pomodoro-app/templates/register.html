<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Promodoro</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-panel: rgba(26, 32, 53, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .ambient-light {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
            animation: float 10s infinite alternate ease-in-out;
        }

        .light-1 { width: 400px; height: 400px; background: #4c1d95; top: -100px; left: -100px; }
        .light-2 { width: 300px; height: 300px; background: #0f766e; bottom: -50px; right: -50px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        @media (hover: none) and (pointer: coarse), (prefers-reduced-motion: reduce) {
            .ambient-light { animation: none; }
        }

        .container {
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 15px;
            filter: drop-shadow(0 0 16px rgba(239, 68, 68, 0.45));
        }
        .logo-icon img { width: 100%; height: 100%; display: block; }

        h2 { margin-bottom: 5px; font-size: 1.4rem; }
        .subtitle { color: var(--text-muted); margin-bottom: 25px; font-size: 0.9rem; }

        form { display: flex; flex-direction: column; gap: 15px; text-align: left; }

        .input-group { position: relative; }
        .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-family: 'Poppins', sans-serif;
            outline: none;
            font-size: 0.95rem;
        }
        input:focus { border-color: var(--accent); }
        input.pw-field { padding-right: 42px; }

        .toggle-password-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 6px;
            display: flex;
            align-items: center;
        }
        .toggle-password-btn:hover { color: var(--text-main); }

        .btn {
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 5px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
        }
        .btn:hover { box-shadow: 0 10px 20px var(--accent-glow); transform: translateY(-2px); }

        .switch-link {
            display: block;
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .switch-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .switch-link a:hover { text-decoration: underline; }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <div class="container">
        <div class="logo-icon"><img src="{{ url_for('static', filename='logo.svg') }}" alt="Promodoro"></div>
        <h2>Crea tu cuenta</h2>
        <div class="subtitle">Empieza tu racha de estudio hoy</div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="username" placeholder="Elige un usuario" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" id="password-input" class="pw-field" placeholder="Elige una contraseña" required>
                <button type="button" class="toggle-password-btn" id="toggle-password-btn" tabindex="-1" aria-label="Mostrar contraseña">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <button type="submit" class="btn">Registrarse</button>
        </form>

        <div class="switch-link">¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a></div>
    </div>

    <script>
        const togglePasswordBtn = document.getElementById('toggle-password-btn');
        const passwordInput = document.getElementById('password-input');

        togglePasswordBtn.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            togglePasswordBtn.innerHTML = isHidden ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        });
    </script>

</body>
</html>
