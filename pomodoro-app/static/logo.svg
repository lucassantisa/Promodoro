<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Cuerpo principal del reloj -->
    <circle cx="32" cy="36" r="24" fill="#ef4444"/>
    
    <!-- Brillo para darle efecto a plástico/metal pintado -->
    <path d="M 16 22 A 18 18 0 0 1 32 14 A 18 18 0 0 0 16 32 Z" fill="#f87171" opacity="0.8"/>

    <!-- Perilla mecánica de cuerda (arriba) -->
    <rect x="26" y="4" width="12" height="6" rx="2" fill="#94a3b8"/>
    <rect x="29" y="10" width="6" height="4" fill="#64748b"/>
    
    <!-- Hojas decorativas de plástico -->
    <path d="M32 14 C24 14, 20 20, 20 20 C26 18, 30 16, 32 14 Z" fill="#22c55e"/>
    <path d="M32 14 C40 14, 44 20, 44 20 C38 18, 34 16, 32 14 Z" fill="#22c55e"/>

    <!-- Ojos -->
    <circle cx="24" cy="28" r="3.5" fill="#ffffff"/>
    <circle cx="24" cy="28" r="1.5" fill="#000000"/>
    <circle cx="40" cy="28" r="3.5" fill="#ffffff"/>
    <circle cx="40" cy="28" r="1.5" fill="#000000"/>
    
    <!-- Sonrisa -->
    <path d="M28 34 Q32 38 36 34" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Separación mecánica del temporizador -->
    <line x1="9" y1="44" x2="55" y2="44" stroke="#b91c1c" stroke-width="2"/>
    
    <!-- Triángulo indicador (flecha del tiempo) -->
    <polygon points="32,44 29,48 35,48" fill="#ffffff"/>

    <!-- Marcas de los minutos (Dial del reloj) -->
    <line x1="32" y1="50" x2="32" y2="54" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="48" x2="20" y2="51" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="48" x2="44" y2="51" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="42" x2="11" y2="43" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="42" x2="53" y2="43" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
